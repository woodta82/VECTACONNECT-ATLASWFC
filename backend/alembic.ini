[alembic]
script_location = migrations/alembic
prepend_sys_path = .
# The database URL is read from DATABASE_URL by env.py; never stored here.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
